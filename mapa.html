<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaTec PY — Mapa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; }
        .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(229,231,235,0.5); }
        #map { height: 600px; width: 100%; border-radius: 8px; z-index: 1; }
        .info-map { padding: 8px 12px; font: 12px/15px 'Inter',sans-serif; background: rgba(255,255,255,0.96); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid #e5e7eb; max-width: 260px; max-height: 420px; overflow-y: auto; }
        .custom-tooltip { background: white; border: 1px solid #047857; border-radius: 6px; font-family: 'Inter',sans-serif; font-size: 12px; }
        #loading-screen { position: fixed; inset: 0; background: rgba(255,255,255,0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 48px; height: 48px; border: 4px solid #d1fae5; border-top-color: #047857; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #detail-panel { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        #detail-panel.open { max-height: 1200px; }
        .badge { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:11px; font-weight:800; letter-spacing:.02em; }
        .leaflet-image-layer { image-rendering: pixelated; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<div id="loading-screen">
    <div class="spinner"></div>
    <p style="margin-top:16px;font-weight:700;color:#065f46;font-size:17px">ClimaTec PY</p>
    <p style="color:#6b7280;font-size:13px;margin-top:4px" data-i18n="cargando"></p>
</div>

<header id="cabecalho" class="bg-emerald-800 text-white px-4 py-3 shadow-lg sticky top-0 z-50 relative">
    <div class="flex justify-between items-center gap-2">
        <div class="flex items-center gap-2 min-w-0">
            <i data-lucide="thermometer-sun" class="w-8 h-8 text-emerald-300 shrink-0"></i>
            <div class="min-w-0">
                <h1 class="text-lg font-bold tracking-tight">ClimaTec PY</h1>
                <p class="text-emerald-200 text-xs truncate" id="subtitulo-sistema"></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="flex items-center bg-emerald-900/60 rounded-lg border border-emerald-700 p-0.5 text-[11px] font-bold">
                <button class="lang-btn px-2 py-1 rounded-md" data-lang="es" onclick="trocarIdioma('es')">ES</button>
                <button class="lang-btn px-2 py-1 rounded-md" data-lang="pt" onclick="trocarIdioma('pt')">PT</button>
                <button class="lang-btn px-2 py-1 rounded-md" data-lang="en" onclick="trocarIdioma('en')">EN</button>
            </div>
            <button id="menu-toggle-btn" onclick="toggleMenu()" class="p-1.5 px-3 bg-emerald-900 border border-emerald-700 rounded-lg text-emerald-100 hover:bg-emerald-700 transition-all flex items-center gap-1.5 text-sm font-bold">
                <span data-i18n="menu"></span> <i data-lucide="menu" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
    <div id="main-menu" class="hidden absolute top-full right-4 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[1000]">
        <div class="p-2 flex flex-col gap-1">
            <button onclick="irPara('index.html')" class="w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="home" class="w-4 h-4"></i> <span data-i18n="m_inicio"></span>
            </button>
            <button onclick="irPara('index.html?secao=atlas')" class="w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="book-image" class="w-4 h-4"></i> <span data-i18n="m_atlas"></span>
            </button>
            <button id="menu-koppen" onclick="irPara('mapa.html?sistema=koppen')" class="menu-sis w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="cloud-rain" class="w-4 h-4"></i> Köppen-Geiger
            </button>
            <button id="menu-thornthwaite" onclick="irPara('mapa.html?sistema=thornthwaite')" class="menu-sis w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="droplets" class="w-4 h-4"></i> Thornthwaite
            </button>
            <button id="menu-holdridge" onclick="irPara('mapa.html?sistema=holdridge')" class="menu-sis w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="trees" class="w-4 h-4"></i> Holdridge
            </button>
        </div>
    </div>
</header>

<main class="container mx-auto p-3 md:p-5">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div class="lg:col-span-1">
            <div id="painel" class="glass-card p-4 rounded-2xl shadow-sm border-t-4">
                <h2 class="text-sm font-bold mb-3 text-slate-800 flex items-center gap-2 border-b pb-2">
                    <i data-lucide="map-pin" class="w-4 h-4 text-emerald-700"></i> <span data-i18n="parametros"></span>
                </h2>
                <div id="bloco-camada" class="hidden">
                    <label class="block mb-1 text-xs font-bold text-slate-500 uppercase" data-i18n="capa"></label>
                    <select id="camadaSelect" class="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700 text-sm mb-3"></select>
                </div>
                <label class="block mb-1 text-xs font-bold text-slate-500 uppercase" data-i18n="departamento"></label>
                <select id="depSelect" class="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700 text-sm mb-3"></select>
                <label class="block mb-1 text-xs font-bold text-slate-500 uppercase" data-i18n="distrito"></label>
                <select id="distSelect" class="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700 text-sm mb-3"></select>
                <label class="block mb-1 text-xs font-bold text-slate-500 uppercase"><span data-i18n="opacidad"></span>: <span id="opac-val">85</span>%</label>
                <input id="opacidade" type="range" min="0" max="100" value="85" class="w-full accent-emerald-700 mb-2">
                <p class="text-[11px] text-slate-500 mt-1 leading-relaxed">
                    <i data-lucide="mouse-pointer-click" class="w-3 h-3 inline"></i> <span data-i18n="ayuda_clic"></span>
                </p>
                <div class="mt-4 space-y-2">
                    <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3">
                        <h4 class="text-[10px] font-black text-emerald-800 uppercase tracking-widest mb-1" data-i18n="fuente_datos"></h4>
                        <p class="text-[10px] text-emerald-700 leading-relaxed" data-i18n="fuente_texto"></p>
                    </div>
                    <div id="map-status" class="text-[10px] text-center py-1.5 px-2 rounded-lg font-bold bg-slate-100 text-slate-500">…</div>
                </div>
            </div>
        </div>
        <div class="lg:col-span-3">
            <div class="glass-card p-2 rounded-2xl shadow-sm border border-slate-200">
                <div id="map"></div>
            </div>

            <div id="detail-panel" class="mt-4">
                <div id="detail-card" class="glass-card p-4 rounded-2xl shadow-sm border-t-4">
                    <div class="flex justify-between items-start mb-3 border-b pb-2">
                        <div>
                            <h3 id="detail-title" class="text-base font-bold text-slate-800">—</h3>
                            <p id="detail-subtitle" class="text-xs text-slate-500"></p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="baixarCSV()" class="p-1.5 px-2.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 flex items-center gap-1.5 text-xs font-bold">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> CSV
                            </button>
                            <button onclick="fecharDetalhe()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-700">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div id="detail-badges" class="flex flex-wrap gap-1.5 mb-3"></div>
                    <div id="detail-indices" class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs mb-4"></div>
                    <h4 class="text-[10px] font-black text-emerald-800 uppercase tracking-widest mb-2" data-i18n="climograma"></h4>
                    <div style="height:280px"><canvas id="climograma"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/comum.js"></script>
<script>
// ==========================================
// CONFIGURAÇÃO DOS SISTEMAS
// ==========================================
const SISTEMAS = {
    koppen: {
        titulo: "Köppen-Geiger", cor: "#2563eb", borda: "border-t-blue-600",
        camadas: ["koppen"], csv: "dados/distritos_koppen.csv",
        classe: r => ({ legenda: "koppen_todas", id: r.koppen_id }),
        indices: [["p_anual", "p_anual", 0, "mm"], ["p_mes_seco", "p_mes_seco", 0, "mm"], ["t_anual", "t_anual", 1, "°C"],
                  ["t_mes_frio", "t_mes_frio", 1, "°C"], ["t_mes_quente", "t_mes_quente", 1, "°C"], ["pet_anual", "pet_anual", 0, "mm"]],
    },
    thornthwaite: {
        titulo: "Thornthwaite (1948)", cor: "#0891b2", borda: "border-t-cyan-600",
        camadas: ["th_umidade", "th_subtipo", "th_termica", "th_concentracao"], csv: "dados/distritos_thornthwaite.csv",
        classe: r => ({ legenda: "th_umidade_todas", id: r.umidade_id, tipo: r.tipo }),
        indices: [["im", "Im", 1, ""], ["ih", "Ih", 1, ""], ["ia", "Ia", 1, ""], ["pet_anual", "ETP_anual", 0, "mm"],
                  ["def_anual", "DEF_anual", 0, "mm"], ["exc_anual", "EXC_anual", 0, "mm"]],
    },
    holdridge: {
        titulo: "Holdridge", cor: "#15803d", borda: "border-t-green-600",
        camadas: ["holdridge"], csv: "dados/distritos_holdridge.csv",
        classe: r => ({ legenda: "holdridge_todas", id: r.zona_id }),
        indices: [["biotemp", "biotemperatura", 1, "°C"], ["p_anual", "P_anual", 0, "mm"], ["eth_anual", "ETP_anual", 0, "mm"],
                  ["razao_etp", "razao_ETP", 2, ""]],
    },
};
const NOME_CAMADA = { koppen: "Köppen-Geiger", th_umidade: "th_umidade", th_subtipo: "th_subtipo",
                      th_termica: "th_termica", th_concentracao: "th_concentracao", holdridge: "Holdridge" };

const params = new URLSearchParams(location.search);
const SISTEMA = SISTEMAS[params.get("sistema")] ? params.get("sistema") : "koppen";
const CFG = SISTEMAS[SISTEMA];
const EMBED = params.get("embed") === "1";

let map, overlay, distLayer, depLayer, legendaCtrl, grafico;
let camadas = {}, legendas = {}, mensal = {}, linhas = new Map(), layerPorId = new Map();
let camadaAtual = CFG.camadas[0], selecionado = null;

function setStatus(txt, cls) { const e = document.getElementById("map-status"); e.textContent = txt; e.className = `text-[10px] text-center py-1.5 px-2 rounded-lg font-bold ${cls}`; }
const nomeCamada = c => NOME_CAMADA[c].startsWith("th_") ? `Thornthwaite — ${t(NOME_CAMADA[c])}` : NOME_CAMADA[c];

// ==========================================
// MAPA
// ==========================================
function initMap() {
    map = L.map("map", { zoomSnap: 0.25 }).setView([-23.4, -58.4], 6.25);
    // Esri Light Gray (sem chave; a CARTO passou a exigir API key)
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ", maxZoom: 16 }).addTo(map);
    map.createPane("classes"); map.getPane("classes").style.zIndex = 350;
}

function mostrarCamada(c) {
    camadaAtual = c;
    if (overlay) map.removeLayer(overlay);
    const info = camadas[c];
    overlay = L.imageOverlay(info.png, info.limites, { opacity: opacidade(), pane: "classes", interactive: false }).addTo(map);
    desenharLegenda();
}
const opacidade = () => Number(document.getElementById("opacidade").value) / 100;

function desenharLegenda() {
    if (legendaCtrl) legendaCtrl.remove();
    legendaCtrl = L.control({ position: "topright" });
    legendaCtrl.onAdd = () => {
        const div = L.DomUtil.create("div", "info-map");
        let h = `<div style="font-weight:700;font-size:10px;text-transform:uppercase;color:#065f46;margin-bottom:6px">${nomeCamada(camadaAtual)}</div>`;
        Object.values(legendas[camadaAtual]).forEach(v => {
            h += `<div style="display:flex;align-items:flex-start;margin-bottom:3px">
                <div style="width:12px;height:12px;min-width:12px;background:${v.cor};border:1px solid #333;margin:1px 6px 0 0;border-radius:2px"></div>
                <span style="font-size:11px">${v.nome[LANG]}</span></div>`;
        });
        div.innerHTML = h;
        L.DomEvent.disableScrollPropagation(div);
        return div;
    };
    legendaCtrl.addTo(map);
}

const estiloDist = { color: "#334155", weight: 0.5, opacity: 0.8, fillOpacity: 0, fillColor: "#000" };
const estiloSel = { color: "#000", weight: 2.5, opacity: 1, fillOpacity: 0.05 };

function desenharDistritos(geo) {
    distLayer = L.geoJSON(geo, {
        style: () => estiloDist,
        onEachFeature: (f, layer) => {
            const id = f.properties.id;
            layerPorId.set(id, layer);
            layer.bindTooltip(() => tooltipDistrito(id), { sticky: true, className: "custom-tooltip" });
            layer.on("mouseover", () => { if (id !== selecionado) layer.setStyle({ weight: 1.5, color: "#000" }); });
            layer.on("mouseout", () => { if (id !== selecionado) layer.setStyle(estiloDist); });
            layer.on("click", () => selecionarDistrito(id, false));
        },
    }).addTo(map);
}

function tooltipDistrito(id) {
    const r = linhas.get(id);
    if (!r) return id;
    const c = CFG.classe(r);
    const leg = legendas[c.legenda][String(c.id)];
    const cl = c.tipo ? c.tipo : (leg ? leg.nome[LANG] : t("sin_datos"));
    return `<div style="text-align:left"><b style="color:#065f46">${t("distrito")}:</b> ${r.distrito}<br>
            <b style="color:#065f46">${t("departamento")}:</b> ${r.departamento}<br><b style="color:#065f46">${CFG.titulo}:</b> ${cl}</div>`;
}

// ==========================================
// SELETORES
// ==========================================
function preencherDepartamentos() {
    const deps = [...new Set([...linhas.values()].map(r => r.departamento))].sort((a, b) => a.localeCompare(b, "es"));
    const sel = document.getElementById("depSelect"), atual = sel.value;
    sel.innerHTML = `<option value="">${t("todos_departamentos")}</option>` + deps.map(d => `<option value="${d}">${d}</option>`).join("");
    sel.value = atual;
}
function preencherDistritos() {
    const dep = document.getElementById("depSelect").value;
    const lista = [...linhas.values()].filter(r => !dep || r.departamento === dep)
        .sort((a, b) => a.distrito.localeCompare(b.distrito, "es"));
    const sel = document.getElementById("distSelect");
    sel.innerHTML = `<option value="">${t("seleccione_distrito")}</option>` +
        lista.map(r => `<option value="${r.id}">${r.distrito}${dep ? "" : " (" + r.departamento + ")"}</option>`).join("");
    if (selecionado) sel.value = selecionado;
}
function preencherCamadas() {
    const sel = document.getElementById("camadaSelect");
    sel.innerHTML = CFG.camadas.map(c => `<option value="${c}">${nomeCamada(c)}</option>`).join("");
    sel.value = camadaAtual;
    document.getElementById("bloco-camada").classList.toggle("hidden", CFG.camadas.length < 2);
}

// ==========================================
// DETALHE DO DISTRITO
// ==========================================
function badge(txt, cor) { return `<span class="badge" style="background:${cor};color:#111;border:1px solid rgba(0,0,0,.15)">${txt}</span>`; }
function cartao(rotulo, val, un) {
    return `<div class="bg-slate-50 border border-slate-100 rounded-lg p-2">
        <div class="text-[9px] font-bold text-slate-400 uppercase tracking-wide">${rotulo}</div>
        <div class="text-sm font-bold text-slate-700">${val}${un ? " " + un : ""}</div></div>`;
}

function selecionarDistrito(id, zoom) {
    if (selecionado && layerPorId.get(selecionado)) layerPorId.get(selecionado).setStyle(estiloDist);
    selecionado = id;
    const layer = layerPorId.get(id);
    if (layer) { layer.setStyle(estiloSel); layer.bringToFront(); if (zoom) map.fitBounds(layer.getBounds(), { maxZoom: 10 }); }
    document.getElementById("distSelect").value = id;
    renderDetalhe();
    document.getElementById("detail-panel").classList.add("open");
    if (!EMBED) document.getElementById("detail-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderDetalhe() {
    if (!selecionado) return;
    const r = linhas.get(selecionado);
    document.getElementById("detail-title").textContent = r.distrito;
    document.getElementById("detail-subtitle").textContent = `${r.departamento} · GADM ${r.id}`;
    const c = CFG.classe(r);
    const leg = legendas[c.legenda][String(c.id)];
    let b = "";
    if (leg) {
        if (c.tipo) b += badge(`${t("tipo_completo")}: ${c.tipo}`, "#e2e8f0");
        b += badge(leg.nome[LANG], leg.cor);
        b += `<span class="text-[11px] text-slate-500 self-center">${t("clase_mayoritaria")}: ${fmt(r.pct_area, 0)}% ${t("del_area")}</span>`;
    } else b = `<span class="text-xs text-slate-400">${t("sin_datos")}</span>`;
    document.getElementById("detail-badges").innerHTML = b;
    document.getElementById("detail-indices").innerHTML =
        CFG.indices.map(([k, col, d, un]) => cartao(t(k), fmt(r[col], d), un)).join("");
    renderGrafico();
}

function renderGrafico() {
    const m = mensal[selecionado];
    if (grafico) grafico.destroy();
    if (!m) return;
    grafico = new Chart(document.getElementById("climograma").getContext("2d"), {
        data: {
            labels: t("meses"),
            datasets: [
                { type: "bar", label: t("precipitacion"), data: m.pr, backgroundColor: "rgba(37,99,235,0.55)", borderColor: "rgba(37,99,235,1)", borderWidth: 1, yAxisID: "y", order: 3 },
                { type: "line", label: t("etp"), data: m.pet, borderColor: "#16a34a", backgroundColor: "#16a34a", borderDash: [5, 3], tension: 0.3, yAxisID: "y", pointRadius: 2, order: 2 },
                { type: "line", label: t("temp_media"), data: m.tas, borderColor: "#dc2626", backgroundColor: "#dc2626", tension: 0.3, yAxisID: "y1", pointRadius: 3, order: 1 },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
            plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 10 } } } },
            scales: { y: { position: "left", title: { display: true, text: "mm", font: { size: 10 } }, beginAtZero: true },
                      y1: { position: "right", title: { display: true, text: "°C", font: { size: 10 } }, grid: { drawOnChartArea: false } } },
        },
    });
}

function fecharDetalhe() {
    document.getElementById("detail-panel").classList.remove("open");
    if (selecionado && layerPorId.get(selecionado)) layerPorId.get(selecionado).setStyle(estiloDist);
    selecionado = null;
    document.getElementById("distSelect").value = "";
}

// ==========================================
// CSV DO DISTRITO
// ==========================================
function slug(s) { return (s || "distrito").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, ""); }
function baixarCSV() {
    if (!selecionado) return;
    const r = linhas.get(selecionado), m = mensal[selecionado];
    const c = CFG.classe(r), leg = legendas[c.legenda][String(c.id)];
    const anual = [{ ...r, clase: leg ? leg.nome[LANG] : "" }];
    const mens = m ? t("meses").map((mes, i) => ({ id: r.id, distrito: r.distrito, mes, mes_num: i + 1,
        pr_mm: m.pr[i], pet_mm: m.pet[i], tas_c: m.tas[i] })) : [];
    const txt = [`# ClimaTec PY — ${CFG.titulo} — ${r.distrito} (${r.departamento})`,
                 "# CHELSA V2.1, 1991-2020", "# 1", Papa.unparse(anual), "", "# 2", Papa.unparse(mens)].join("\n");
    const blob = new Blob(["﻿" + txt], { type: "text/csv;charset=utf-8;" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `${SISTEMA}_${slug(r.distrito)}.csv` });
    document.body.appendChild(a); a.click(); a.remove();
}

// ==========================================
// CARGA
// ==========================================
async function carregar() {
    setStatus(t("cargando"), "bg-yellow-100 text-yellow-800");
    try {
        const [cam, leg, men, geo, dep, csv] = await Promise.all([
            fetch("dados/camadas.json").then(r => r.json()),
            fetch("dados/legendas.json").then(r => r.json()),
            fetch("dados/mensal_distritos.json").then(r => r.json()),
            fetch("dados/distritos.geojson").then(r => r.json()),
            fetch("dados/departamentos.geojson").then(r => r.json()),
            fetch(CFG.csv).then(r => r.text()),
        ]);
        camadas = cam; legendas = leg; mensal = men;
        Papa.parse(csv, { header: true, skipEmptyLines: true, dynamicTyping: true }).data.forEach(r => linhas.set(r.id, r));
        mostrarCamada(camadaAtual);
        desenharDistritos(geo);
        depLayer = L.geoJSON(dep, { style: { color: "#111", weight: 1.4, fill: false }, interactive: false }).addTo(map);
        map.fitBounds(depLayer.getBounds(), { padding: [10, 10] });
        preencherCamadas(); preencherDepartamentos(); preencherDistritos();
        setStatus(`${CFG.titulo} — ${t("listo")}`, "bg-green-100 text-green-800");
        const d = params.get("distrito");
        if (d && linhas.has(d)) selecionarDistrito(d, true);
    } catch (e) {
        console.error(e);
        setStatus(t("error_carga"), "bg-red-100 text-red-800");
    }
    document.getElementById("loading-screen").style.display = "none";
}

// ==========================================
// EVENTOS
// ==========================================
document.getElementById("camadaSelect").addEventListener("change", e => mostrarCamada(e.target.value));
document.getElementById("opacidade").addEventListener("input", e => {
    document.getElementById("opac-val").textContent = e.target.value;
    if (overlay) overlay.setOpacity(opacidade());
});
document.getElementById("depSelect").addEventListener("change", e => {
    preencherDistritos();
    const dep = e.target.value;
    if (!dep) { map.fitBounds(depLayer.getBounds()); return; }
    const camadasDep = [];
    distLayer.eachLayer(l => { if (l.feature.properties.departamento === dep) camadasDep.push(l); });
    if (camadasDep.length) map.fitBounds(L.featureGroup(camadasDep).getBounds());
});
document.getElementById("distSelect").addEventListener("change", e => { if (e.target.value) selecionarDistrito(e.target.value, true); });

document.addEventListener("idioma", () => {
    document.getElementById("subtitulo-sistema").textContent = CFG.titulo;
    if (Object.keys(legendas).length) { desenharLegenda(); preencherCamadas(); preencherDepartamentos(); preencherDistritos(); }
    if (selecionado) renderDetalhe();
    iconesLucide();
});

window.onload = () => {
    document.title = `ClimaTec PY — ${CFG.titulo}`;
    document.getElementById("subtitulo-sistema").textContent = CFG.titulo;
    document.getElementById("painel").classList.add(CFG.borda);
    document.getElementById("detail-card").classList.add(CFG.borda);
    document.getElementById("menu-" + SISTEMA).classList.add("bg-emerald-50", "text-emerald-700");
    if (EMBED) document.getElementById("cabecalho").classList.add("hidden");
    aplicarIdioma();
    iconesLucide();
    initMap();
    carregar();
};
</script>
</body>
