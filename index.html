<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaTec PY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; }
        .header-py { background: linear-gradient(to bottom, #D52B1E 0 33.34%, #FFFFFF 33.34% 66.67%, #0038A8 66.67% 100%); }
        .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(229,231,235,0.5); }
        .class-card { transition: transform .18s ease, box-shadow .18s ease; }
        .class-card:hover { transform: translateY(-4px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15); }
        .hero-bg {
            background: radial-gradient(circle at 15% 15%, rgba(213,43,30,0.13), transparent 45%),
                        radial-gradient(circle at 85% 10%, rgba(0,56,168,0.15), transparent 45%),
                        linear-gradient(90deg, rgba(213,43,30,0.04), rgba(0,56,168,0.06));
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<header class="header-py text-slate-900 px-4 py-3 shadow-lg sticky top-0 z-50 relative">
    <div class="flex justify-between items-center gap-2">
        <div class="flex items-center gap-2 min-w-0 bg-white rounded-xl border border-slate-300 shadow px-2 py-0.5">
            <span class="shrink-0"><i data-lucide="thermometer-sun" class="w-7 h-7 text-[#D52B1E]"></i></span>
            <div class="min-w-0">
                <h1 class="text-lg leading-tight font-extrabold tracking-tight text-black">ClimaTec PY</h1>
                <p class="text-black text-xs font-semibold truncate" data-i18n="app_subtitulo"></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="flex items-center bg-white rounded-lg border border-slate-300 shadow p-0.5 text-[11px] font-bold">
                <button class="lang-btn px-2 py-1 rounded-md" data-lang="es" onclick="trocarIdioma('es')">ES</button>
                <button class="lang-btn px-2 py-1 rounded-md" data-lang="pt" onclick="trocarIdioma('pt')">PT</button>
                <button class="lang-btn px-2 py-1 rounded-md" data-lang="en" onclick="trocarIdioma('en')">EN</button>
            </div>
            <button id="menu-toggle-btn" onclick="toggleMenu()" class="p-1.5 px-3 bg-white border border-slate-300 shadow rounded-lg text-slate-900 hover:bg-slate-100 transition-all flex items-center gap-1.5 text-sm font-bold">
                <span class="hidden sm:inline" data-i18n="menu"></span> <i data-lucide="menu" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
    <div id="main-menu" class="hidden absolute top-full right-4 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[100]">
        <div class="p-2 flex flex-col gap-1">
            <button onclick="toggleMenu(); window.scrollTo({top:0,behavior:'smooth'})" class="w-full text-left px-3 py-2.5 bg-blue-50 text-blue-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="home" class="w-4 h-4"></i> <span data-i18n="m_inicio"></span>
            </button>
            <button onclick="abrirMapas()" class="w-full text-left px-3 py-2.5 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="map" class="w-4 h-4"></i> <span data-i18n="m_mapas"></span>
            </button>
            <button onclick="abrirAtlas()" class="w-full text-left px-3 py-2.5 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="book-image" class="w-4 h-4"></i> <span data-i18n="m_atlas"></span>
            </button>
            <button onclick="irPara('mapa.html?sistema=koppen')" class="w-full text-left px-3 py-2.5 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="cloud-rain" class="w-4 h-4"></i> Köppen-Geiger
            </button>
            <button onclick="irPara('mapa.html?sistema=thornthwaite')" class="w-full text-left px-3 py-2.5 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="droplets" class="w-4 h-4"></i> Thornthwaite
            </button>
            <button onclick="irPara('mapa.html?sistema=holdridge')" class="w-full text-left px-3 py-2.5 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="trees" class="w-4 h-4"></i> Holdridge
            </button>
        </div>
    </div>
</header>

<main class="container mx-auto p-4 md:p-8 hero-bg">
    <div class="max-w-3xl mx-auto text-center mb-10 pt-6">
        <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-3" data-i18n="hero_titulo"></h2>
        <p class="text-sm md:text-base text-slate-500 leading-relaxed" data-i18n="hero_texto"></p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 max-w-5xl mx-auto">
        <a href="mapa.html?sistema=koppen" onclick="event.preventDefault(); irPara(this.getAttribute('href'))" class="class-card glass-card rounded-2xl p-6 shadow-sm border-t-4 border-t-blue-500 block">
            <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center mb-4">
                <i data-lucide="cloud-rain" class="w-6 h-6 text-blue-600"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 mb-1">Köppen-Geiger</h3>
            <p class="text-xs text-slate-500 leading-relaxed mb-4" data-i18n="card_koppen"></p>
            <span class="text-xs font-bold text-blue-600 flex items-center gap-1">
                <span data-i18n="abrir_mapa"></span> <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </span>
        </a>
        <a href="mapa.html?sistema=thornthwaite" onclick="event.preventDefault(); irPara(this.getAttribute('href'))" class="class-card glass-card rounded-2xl p-6 shadow-sm border-t-4 border-t-cyan-500 block">
            <div class="w-12 h-12 rounded-xl bg-cyan-50 flex items-center justify-center mb-4">
                <i data-lucide="droplets" class="w-6 h-6 text-cyan-600"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 mb-1">Thornthwaite</h3>
            <p class="text-xs text-slate-500 leading-relaxed mb-4" data-i18n="card_thornthwaite"></p>
            <span class="text-xs font-bold text-cyan-600 flex items-center gap-1">
                <span data-i18n="abrir_mapa"></span> <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </span>
        </a>
        <a href="mapa.html?sistema=holdridge" onclick="event.preventDefault(); irPara(this.getAttribute('href'))" class="class-card glass-card rounded-2xl p-6 shadow-sm border-t-4 border-t-red-600 block">
            <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center mb-4">
                <i data-lucide="trees" class="w-6 h-6 text-red-700"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 mb-1">Holdridge</h3>
            <p class="text-xs text-slate-500 leading-relaxed mb-4" data-i18n="card_holdridge"></p>
            <span class="text-xs font-bold text-red-700 flex items-center gap-1">
                <span data-i18n="abrir_mapa"></span> <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </span>
        </a>
    </div>

    <div class="max-w-5xl mx-auto mt-8">
        <div class="glass-card rounded-2xl p-4 border border-slate-100 flex items-center gap-2">
            <i data-lucide="database" class="w-4 h-4 text-blue-600 shrink-0"></i>
            <p class="text-[11px] text-slate-500" data-i18n="rodape_dados"></p>
        </div>
    </div>

    <!-- MAPAS: páginas de cada sistema em iframe -->
    <section id="mapas-section" class="hidden max-w-6xl mx-auto mt-10 scroll-mt-20">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="map" class="w-5 h-5 text-blue-700"></i> <span data-i18n="m_mapas"></span>
            </h2>
            <button onclick="fecharMapas()" class="p-1.5 rounded-lg hover:bg-slate-200 text-slate-500 hover:text-slate-800" data-i18n-attr="title:cerrar">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="flex flex-wrap gap-2 mb-4">
            <button id="tab-koppen" onclick="mostrarMapa('koppen')" class="mapa-tab px-4 py-2 rounded-xl text-sm font-bold border-t-4 border-t-blue-500 bg-white shadow-sm flex items-center gap-1.5">
                <i data-lucide="cloud-rain" class="w-4 h-4 text-blue-600"></i> Köppen-Geiger
            </button>
            <button id="tab-thornthwaite" onclick="mostrarMapa('thornthwaite')" class="mapa-tab px-4 py-2 rounded-xl text-sm font-bold border-t-4 border-t-cyan-500 bg-white shadow-sm flex items-center gap-1.5">
                <i data-lucide="droplets" class="w-4 h-4 text-cyan-600"></i> Thornthwaite
            </button>
            <button id="tab-holdridge" onclick="mostrarMapa('holdridge')" class="mapa-tab px-4 py-2 rounded-xl text-sm font-bold border-t-4 border-t-red-600 bg-white shadow-sm flex items-center gap-1.5">
                <i data-lucide="trees" class="w-4 h-4 text-red-700"></i> Holdridge
            </button>
            <a id="abrir-em-nova-aba" href="mapa.html?sistema=koppen" target="_blank" rel="noopener" class="ml-auto px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-blue-700 hover:bg-blue-50 flex items-center gap-1.5">
                <span data-i18n="abrir_nueva_pestana"></span> <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
            </a>
        </div>
        <div class="glass-card rounded-2xl shadow-sm border border-slate-100 overflow-hidden" style="height: 82vh;">
            <iframe id="mapa-iframe" src="" title="Mapa" class="w-full h-full border-0" loading="lazy"></iframe>
        </div>
    </section>

    <!-- ATLAS: galeria gerada a partir de atlas/atlas.json -->
    <section id="atlas-section" class="hidden max-w-5xl mx-auto mt-10 scroll-mt-20">
        <div class="flex items-center justify-between mb-2">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="book-image" class="w-5 h-5 text-blue-700"></i> <span data-i18n="atlas_titulo"></span>
            </h2>
            <button onclick="fecharAtlas()" class="p-1.5 rounded-lg hover:bg-slate-200 text-slate-500 hover:text-slate-800" data-i18n-attr="title:cerrar">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <p class="text-xs text-slate-500 mb-6 leading-relaxed" data-i18n="atlas_texto"></p>
        <div id="atlas-conteudo"><p class="text-xs text-slate-400" data-i18n="cargando"></p></div>
    </section>

    <div id="lightbox" class="hidden fixed inset-0 bg-black/80 z-[200] items-center justify-center p-4 cursor-zoom-out" onclick="fecharLightbox()">
        <img id="lightbox-img" src="" alt="" class="max-w-full max-h-full rounded-lg shadow-2xl">
    </div>
</main>

<footer class="text-center py-6 text-[11px] text-slate-400">
    ClimaTec PY — UTFPR Campus Santa Helena
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/comum.js"></script>
<script>
let sistemaMapa = null;
let atlas = null;

function abrirMapas() {
    document.getElementById("main-menu").classList.add("hidden");
    fecharAtlas();
    document.getElementById("mapas-section").classList.remove("hidden");
    mostrarMapa(sistemaMapa || "koppen");
    document.getElementById("mapas-section").scrollIntoView({ behavior: "smooth", block: "start" });
}
function fecharMapas() {
    document.getElementById("mapas-section").classList.add("hidden");
    document.getElementById("mapa-iframe").src = "";
}
function mostrarMapa(sistema) {
    sistemaMapa = sistema;
    const pagina = `mapa.html?sistema=${sistema}&lang=${LANG}&embed=1`;
    document.getElementById("mapa-iframe").src = pagina;
    document.getElementById("abrir-em-nova-aba").href = `mapa.html?sistema=${sistema}&lang=${LANG}`;
    document.querySelectorAll(".mapa-tab").forEach(b => b.classList.remove("ring-2", "ring-blue-400"));
    document.getElementById("tab-" + sistema).classList.add("ring-2", "ring-blue-400");
}

async function abrirAtlas() {
    document.getElementById("main-menu").classList.add("hidden");
    fecharMapas();
    document.getElementById("atlas-section").classList.remove("hidden");
    document.getElementById("atlas-section").scrollIntoView({ behavior: "smooth", block: "start" });
    if (!atlas) {
        try { atlas = await (await fetch("atlas/atlas.json")).json(); }
        catch (e) { document.getElementById("atlas-conteudo").innerHTML = `<p class="text-xs text-red-600">${t("error_carga")}</p>`; return; }
    }
    renderAtlas();
}
function fecharAtlas() { document.getElementById("atlas-section").classList.add("hidden"); }

const ICONE_GRUPO = { koppen: ["cloud-rain", "text-blue-600"], thornthwaite: ["droplets", "text-cyan-600"],
                      holdridge: ["trees", "text-red-700"], variaveis: ["thermometer", "text-red-600"] };

function renderAtlas() {
    if (!atlas) return;
    let n = 0, h = "";
    atlas.grupos.forEach(g => {
        const [ic, cor] = ICONE_GRUPO[g.id] || ["image", "text-slate-600"];
        h += `<h3 class="text-base font-bold text-slate-700 mt-8 mb-3 flex items-center gap-1.5"><i data-lucide="${ic}" class="w-4 h-4 ${cor}"></i> ${g.titulo[LANG]}</h3>`;
        h += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-5">`;
        g.figuras.forEach(f => {
            n += 1;
            const src = `atlas/${LANG}/${f.arquivo}`;
            h += `<figure class="glass-card rounded-2xl shadow-sm border border-slate-100 overflow-hidden ${f.largo ? "sm:col-span-2" : ""}">
                <img src="${src}" alt="${f.legenda[LANG]}" loading="lazy" class="w-full h-auto cursor-zoom-in" onclick="abrirLightbox(this.src)">
                <figcaption class="p-3 text-xs text-slate-600"><span class="font-bold">${t("figura")} ${n}.</span> ${f.legenda[LANG]}</figcaption>
            </figure>`;
        });
        h += `</div>`;
    });
    document.getElementById("atlas-conteudo").innerHTML = h;
    iconesLucide();
}

function abrirLightbox(src) {
    const lb = document.getElementById("lightbox");
    document.getElementById("lightbox-img").src = src;
    lb.classList.remove("hidden"); lb.classList.add("flex");
}
function fecharLightbox() {
    const lb = document.getElementById("lightbox");
    lb.classList.add("hidden"); lb.classList.remove("flex");
    document.getElementById("lightbox-img").src = "";
}

document.addEventListener("idioma", () => {
    if (!document.getElementById("mapas-section").classList.contains("hidden")) mostrarMapa(sistemaMapa);
    if (!document.getElementById("atlas-section").classList.contains("hidden")) renderAtlas();
    iconesLucide();
});

window.onload = () => {
    aplicarIdioma();
    iconesLucide();
    const sec = new URLSearchParams(location.search).get("secao");
    if (sec === "mapas") abrirMapas();
    if (sec === "atlas") abrirAtlas();
};
</script>
</body>
</html>
