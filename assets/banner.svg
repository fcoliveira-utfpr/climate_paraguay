<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ClimaTec PY — Köppen-Geiger, Thornthwaite, Holdridge">
  <defs>
    <clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- franjas rojo, blanco, azul -->
    <rect width="1200" height="100" fill="#D52B1E"/>
    <rect y="100" width="1200" height="100" fill="#FFFFFF"/>
    <rect y="200" width="1200" height="100" fill="#0038A8"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="176" font-size="80" font-weight="800" fill="#0f172a">ClimaTec <tspan fill="#D52B1E">P</tspan><tspan fill="#0038A8">Y</tspan></text>
    <text x="600" y="246" font-size="28" font-weight="600" fill="#FFFFFF">Köppen-Geiger · Thornthwaite · Holdridge</text>
